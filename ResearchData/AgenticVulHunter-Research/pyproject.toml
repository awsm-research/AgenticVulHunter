[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticvulhunter-research"
version = "0.2.1"
description = "Reproducible AgenticVulHunter research pipeline using frozen A/D/C Stage-1 diffs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Nishant Abhishek"}]
dependencies = []

[project.scripts]
avh-research = "agenticbughunter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["agenticbughunter*"]

[tool.setuptools.package-data]
agenticbughunter = [
  "prompts/*.md",
  "bm25/files/stage2_5_model/*.json",
  "research_data/stage_1_annotated/annotated/*.diff",
  "research_data/stage_1_annotated/raw/*.diff",
  "research_data/*.toml",
]
