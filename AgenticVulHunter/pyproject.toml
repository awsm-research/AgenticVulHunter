[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenticvulhunter"
version = "1.0.3"
description = "AgenticVulHunter secure code review tool"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
agenticvulhunter = "agenticvulhunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenticvulhunter"]

[tool.hatch.build]
include = [
    "agenticvulhunter/**/*.py",
    "agenticvulhunter/prompts/*.md",
    "agenticvulhunter/bm25/rules.json",
]