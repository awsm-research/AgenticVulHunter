[llm]
base_url = "http://localhost:11434/v1"
api_key = "ollama"
model = "qwen3-coder:30b"
timeout_seconds = 300
max_tokens = 6000
temperature = 0.0

[bm25]
endpoint = "http://localhost:5056/predict"
timeout_seconds = 120
top_k = 10
max_requests_per_candidate = 4

[pipeline]
max_candidates = 5
max_hypotheses = 5
confidence_threshold = 0.75
max_comments = 5
block_on_findings = true
isolate_worktree = true
keep_worktree = false

[agents]
stage1_max_steps = 4
stage2_max_steps = 10
stage3_max_steps = 8
stage4_mode = "api"
stage4_max_steps = 5

[repository]
context_radius = 20
max_read_lines = 220
max_search_results = 30
