[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticbughunter"
version = "0.5.0"
description = "Project-local agentic secure-code-review Git gate with integrated BM25 retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AgenticBugHunter"}]
dependencies = []

[project.scripts]
agenticbughunter = "agenticbughunter.cli:main"
abh = "agenticbughunter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["agenticbughunter*"]

[tool.setuptools.package-data]
agenticbughunter = ["prompts/*.md", "bm25/files/stage2_5_model/*.json"]
