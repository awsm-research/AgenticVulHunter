# AgenticBugHunter project configuration
#
# Every setting can also be overridden temporarily with an ABH_* environment
# variable. Run `agenticbughunter config env` to see the full mapping.

[llm]
provider = "openai"
base_url = "http://localhost:11434/v1"
model = "qwen3-coder:30b"
timeout_seconds = 300
max_tokens = 6000
temperature = 0.0

[pipeline]
max_candidates = 5
max_hypotheses = 5
confidence_threshold = 0.75
max_comments = 5
block_on_findings = true
isolate_worktree = true
keep_worktree = false

[bm25]
top_k = 10
max_requests_per_candidate = 4

[agents]
stage1_max_steps = 30
stage2_max_steps = 30
stage3_max_steps = 30
stage4_mode = "api"
stage4_max_steps = 10

[repository]
context_radius = 200
max_read_lines = 300
max_search_results = 30

# Presentation only. These settings never change review decisions.
[ui]
banner = true
live_progress = true
show_config = true
show_stage_details = true
